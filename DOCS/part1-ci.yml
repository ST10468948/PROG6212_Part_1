name: Part 1 Documentation and Repository Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-part1-structure:
    name: Verify Part 1 Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate /docs Folder Exists
        run: |
          if [ ! -d "docs" ]; then
            echo "Error: /docs directory is missing."
            exit 1
          fi

      - name: Validate ERD File Exists
        run: |
          if [ ! -f "docs/RaceDay_ERD.pdf" ] && [ ! -f "docs/RaceDay_ERD.png" ]; then
            echo "Error: RaceDay_ERD (.pdf or .png) missing in /docs."
            exit 1
          fi

      - name: Validate API Endpoint Plan Exists
        run: |
          if [ ! -f "docs/RaceDay_API_Endpoint_Plan.pdf" ] && [ ! -f "docs/RaceDay_API_Endpoint_Plan.md" ]; then
            echo "Error: RaceDay_API_Endpoint_Plan (.pdf or .md) missing in /docs."
            exit 1
          fi

      - name: Validate SQL Database Script Exists
        run: |
          if [ ! -f "docs/RaceDay_Database.sql" ]; then
            echo "Error: RaceDay_Database.sql missing in /docs."
            exit 1
          fi

      - name: Validate README.md Exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "Error: README.md is missing in the root directory."
            exit 1
          fi

      - name: Success Summary
        run: echo "All Part 1 required artifacts are present and verified."