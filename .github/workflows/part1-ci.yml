name: Part 1 Documentation Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-part1:
    name: Verify Part 1 Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: test -d docs

      - name: Check ERD file exists
        run: |
          if [ ! -f "docs/RaceDay_ERD.pdf" ] && [ ! -f "docs/RaceDay_ERD.png" ]; then
            echo "Error: RaceDay_ERD (.pdf or .png) missing in /docs"
            exit 1
          fi

      - name: Check API Endpoint Plan exists
        run: |
          if [ ! -f "docs/RaceDay_API_Endpoint_Plan.pdf" ] && [ ! -f "docs/RaceDay_API_Endpoint_Plan.md" ]; then
            echo "Error: RaceDay_API_Endpoint_Plan (.pdf or .md) missing in /docs"
            exit 1
          fi

      - name: Check SQL Database Script exists
        run: test -f docs/RaceDay_Database.sql

      - name: Check README file exists
        run: test -f README.md

      - name: Workflow Success Confirmation
        run: echo "All required Part 1 planning artifacts are verified."
